name: Empacotar

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            nome: windows
          - os: macos-14
            nome: macos-arm64
          - os: macos-15-intel
            nome: macos-intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: dualsense-painel
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r dualsense-painel/requirements.txt pyinstaller
      - name: Testes
        working-directory: dualsense-painel
        run: python -m unittest discover -s tests -t .
      - name: PyInstaller
        working-directory: dualsense-painel
        run: python -m PyInstaller --noconfirm empacotar/dualsense-painel.spec
      - name: Compactar (Windows)
        if: runner.os == 'Windows'
        working-directory: dualsense-painel/dist
        run: Compress-Archive -Path "Painel do DualSense" -DestinationPath "Painel-DualSense-${{ matrix.nome }}.zip"
      - name: Compactar (macOS)
        if: runner.os == 'macOS'
        working-directory: dualsense-painel/dist
        run: ditto -c -k --keepParent "Painel do DualSense.app" "Painel-DualSense-${{ matrix.nome }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: Painel-DualSense-${{ matrix.nome }}
          path: dualsense-painel/dist/Painel-DualSense-${{ matrix.nome }}.zip
      - name: Publicar na release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dualsense-painel/dist/Painel-DualSense-${{ matrix.nome }}.zip
