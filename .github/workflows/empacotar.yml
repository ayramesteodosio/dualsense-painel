name: Empacotar

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            nome: windows
          - os: macos-14
            nome: macos-arm64
          - os: macos-15-intel
            nome: macos-intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          path: dualsense-painel
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Versão
        shell: bash
        run: echo "VERSAO=$([[ "$GITHUB_REF" == refs/tags/v* ]] && echo "${GITHUB_REF_NAME#v}" || echo 0.0.0)" >> "$GITHUB_ENV"
      - name: Versão no código
        shell: bash
        run: printf 'VERSAO = "%s"\n' "$VERSAO" > dualsense-painel/dualsense_painel/versao.py
      - name: Dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r dualsense-painel/requirements.txt pyinstaller
      - name: Testes
        working-directory: dualsense-painel
        run: python -m unittest discover -s tests -t .
      - name: PyInstaller
        working-directory: dualsense-painel
        run: python -m PyInstaller --noconfirm empacotar/dualsense-painel.spec
      - name: Instalador (Windows)
        if: runner.os == 'Windows'
        working-directory: dualsense-painel/empacotar
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress }
          $env:Path += ";${env:ProgramFiles(x86)}\Inno Setup 6"
          iscc /DVersao=$env:VERSAO windows.iss
          Move-Item "../dist/Instalar-Painel-DualSense.exe" "../dist/Painel-DualSense-windows.exe"
      - name: Imagem de disco (macOS)
        if: runner.os == 'macOS'
        working-directory: dualsense-painel/dist
        run: |
          mkdir dmg
          ditto "Painel do DualSense.app" "dmg/Painel do DualSense.app"
          ln -s /Applications dmg/Aplicativos
          hdiutil create -volname "Painel do DualSense" -srcfolder dmg -ov -format UDZO "Painel-DualSense-${{ matrix.nome }}.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: Painel-DualSense-${{ matrix.nome }}
          path: |
            dualsense-painel/dist/Painel-DualSense-*.exe
            dualsense-painel/dist/Painel-DualSense-*.dmg
      - name: Publicar na release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dualsense-painel/dist/Painel-DualSense-*.exe
            dualsense-painel/dist/Painel-DualSense-*.dmg

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          path: dualsense-painel
      - name: Pacote .deb
        working-directory: dualsense-painel
        run: |
          VERSAO=$([[ "$GITHUB_REF" == refs/tags/v* ]] && echo "${GITHUB_REF_NAME#v}" || echo 0.0.0)
          sh empacotar/deb.sh "$VERSAO"
      - uses: actions/upload-artifact@v4
        with:
          name: Painel-DualSense-linux
          path: dualsense-painel/dist/dualsense-painel_*.deb
      - name: Publicar na release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dualsense-painel/dist/dualsense-painel_*.deb
